# nginx-konfiguraatio - tiketti.esedu.fi
#
# Palvelimen nginx-versio: 1.22.1 (Debian). Huomioi versiorajat:
#   - HTTP/2 vain listen-rivin parametrina, ei erillisenä "http2 on;" -rivinä
#     (erillinen direktiivi vaatii nginx 1.25.1+)
#
# Asennus palvelimelle:
#   sudo cp deploy/nginx/tiketti.esedu.fi.conf /etc/nginx/sites-available/tiketti
#   sudo nginx -t && sudo systemctl reload nginx
#
# Taustapalvelut (docker-compose.yml, vain 127.0.0.1):
#   backend  127.0.0.1:3001   API, WebSocket ja liitetiedostot
#   frontend /var/www/tiketti/dist  staattinen Vite-build

server {
    listen 80;
    server_name tiketti.esedu.fi;

    # Let's Encryptin uusinta ilman HTTPS-uudelleenohjausta
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Ohjaa kaikki muu HTTP-liikenne HTTPS:ään
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # HUOM: vanha http2-syntaksi. Nginx 1.25.1+ käyttää erillistä
    # "http2 on;" -direktiiviä, joka ei kelpaa tätä vanhemmille versioille.
    listen 443 ssl http2;
    server_name tiketti.esedu.fi;

    # SSL-määritykset (certbot ylläpitää)
    ssl_certificate /etc/letsencrypt/live/tiketti.esedu.fi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tiketti.esedu.fi/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Liitetiedostot: multer sallii 10 MB, nginxin oletus olisi vain 1 MB
    client_max_body_size 25m;

    # Pakkaus staattisille tiedostoille
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Suojausotsakkeet. HUOM: nginxissä location-tason add_header korvaa
    # server-tason otsakkeet kokonaan, joten ne toistetaan alempana niissä
    # location-lohkoissa, joissa on oma add_header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS pakottaa selaimen käyttämään HTTPS:ää vuoden ajan tälle
    # osoitteelle. Turvallinen, koska HTTP ohjautuu jo HTTPS:ään.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ---------------------------------------------------------------
    # Frontend (React SPA)
    # ---------------------------------------------------------------

    root /var/www/tiketti/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # tärkeä React Routeria varten
    }

    # Viten hashatut tiedostonimet (esim. index-a1b2c3d4.js) eivät koskaan
    # muutu sisällöltään, joten ne saa välimuistittaa pysyvästi.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # index.html EI saa jäädä välimuistiin: muuten selain lataa julkaisun
    # jälkeen vanhan sivun, joka viittaa jo poistettuihin assets-tiedostoihin.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # ---------------------------------------------------------------
    # Backend
    # ---------------------------------------------------------------

    location /api {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI-generointi ja analyysit voivat kestää yli oletuksen (60 s)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Vastaukset välitetään heti, ei puskuroida (AI-vastaukset)
        proxy_buffering off;
    }

    # Tikettien ja kommenttien liitetiedostot. Backend tarjoilee nämä
    # polusta /uploads (app.ts), ja frontend viittaa niihin suoraan.
    # Ilman tätä lohkoa try_files palauttaisi index.html ja kuvat olisivat rikki.
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (Socket.IO): reaaliaikaiset ilmoitukset ja kommentit
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
